name: Homebrew Formula

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Formula Check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: hakula139/devkit/.github/actions/setup-nix@v3

      - name: Check formula rendering
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for formula in kiln oxide-code; do
            tag="v$(sed -nE 's/^  version "([^"]+)"$/\1/p' "Formula/$formula.rb")"
            mkdir "$RUNNER_TEMP/$formula"
            gh release download "$tag" \
              --repo "hakula139/$formula" \
              --pattern "$formula-*.sha256" \
              --dir "$RUNNER_TEMP/$formula"
            nix develop -c nu scripts/update-homebrew-formula.nu "$formula" "$tag" "$RUNNER_TEMP/$formula"
          done
          git diff --exit-code -- Formula

      - name: Put Homebrew on PATH
        if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"

      # Homebrew requires a tap to install a local formula.
      - name: Install and test formulae
        run: |
          brew tap-new --no-git local/check
          cp Formula/*.rb "$(brew --repository local/check)/Formula/"
          for formula in kiln oxide-code; do
            brew install "local/check/$formula"
            brew test "local/check/$formula"
          done
